# YCT pipeline configuration (v2.2 defaults already decided in docs/prompts/v2.md).
# Every tunable lives here (v2.md §3). Freezing: add an entry to `frozen:` at the phase gate;
# scripts/check_frozen_config.py then forbids any change to that key (or subtree) and forbids
# removing/re-pointing the entry.
#   frozen:
#     - key: window.start_tr   # dotted path
#       frozen_at: <gate commit sha>
schema_version: 1

tribe:
  tr_s: 1.0                    # TR in seconds (tribe_requirements.md)
  n_vertices: 20484            # fsaverage5, both hemispheres

stimulus:
  t1_trim_s: 58.0              # T1: first 58.0 s fed to TRIBE (v2.md §1)
  t1_max_probe_s: 58.5         # ffprobe duration of the trimmed clip must be <= this
  fps: 30                      # CFR (v2.md P2)
  min_source_fps: 16           # V-JEPA2 samples 16 frames/s
  min_short_side_px: 292       # V-JEPA2 short-edge resize; no letterbox/pillarbox padding
  center_crop_px: 256

window:                        # W, set in P4 from label-free mean time course; frozen there
  default_start_tr: 5          # max(5, 4 + L + 1) once P0 latency L is measured
  default_len_tr: 40
  min_tail_s: 2                # exclude from T1 if trimmed duration < W_end + 2 s

era_strata:                    # from the YC batch calendar, not the data (v2.md §1)
  E1: {last_batch: W2016}
  E2: {first_batch: S2016, last_batch: W2020}
  E3: {first_batch: S2020}
era_merge_min_videos: 6        # strata with < 6 videos merge toward E2

budget:
  usd_file: infra/BUDGET_USD   # legacy file; owner value now in SSM /yct/owner/budget_usd (D-030)
  ssm_parameter: /yct/owner/budget_usd
  default_usd: 50
  alert_fraction: 0.8
  max_hours_per_instance: 4

seeds:
  company_pick_salt: "yct-v2.1"  # random.Random(sha256(company_id + salt)).choice(sorted(video_ids))

normalize:                     # P2 (v2.md §5 P2; tribe_requirements §2.3-2.4). Consumed by src/yct/normalize.
  hash_len: 16                 # output names are <sha256(output mp4)[:hash_len]>.mp4 (cache hazard, §2.4)
  edge_tolerance_s: 0.05       # a black/silent interval this close to a file edge counts as leading/trailing
  trim_mode: both              # both = trim only where video is black AND audio silent; either = union
  blackdetect: {min_duration_s: 0.1, pix_th: 0.10, pic_th: 0.98}
  silencedetect: {noise_db: -50, min_duration_s: 0.5}
  video: {codec: libx264, crf: 18, preset: medium, pix_fmt: yuv420p, threads: 1}
  audio: {codec: aac, sample_rate: 48000, bitrate: 192k}
  sidecar_wav: {sample_rate: 16000, channels: 1, subdir: audio16k}   # NOT next to the mp4 (TRIBE reuses <stem>.wav)
  loudness:
    target_lufs: -23.0         # speech-gated integrated loudness target
    true_peak_dbtp: -1.0
    target_lra: 20.0           # loudnorm LRA target; high so linear (pure-gain) mode is used where TP allows
    tolerance_lu: 1.0          # |speech-gated LUFS(out) - target| above this -> flag
    tp_tolerance_db: 0.5       # AAC re-encode overshoot allowance before flagging
    min_speech_s: 1.0          # below this much gated speech, fall back to ungated integrated loudness
  mono_phase: {max_drop_db: 3.0, drop_cap_db: 120.0}   # mono-mix RMS drop vs channel RMS; >max -> flag
  av_sync: {max_offset_ms: 40}
  quality_floor: {short_side_px: 480, crf: 28, subdir: q480}   # 480p round-trip copy
  aspect: {portrait_max_ratio: 0.8}  # width/height <= this -> 9:16 stratum
  ffmpeg_loglevel: error
  photometric:                 # T3 sensitivity copy (owner request); the primary T1 pipeline is unchanged
    enabled: true
    subdir: t3
    analysis_fps: 5            # frames sampled to estimate per-video statistics
    luma_weights: [0.2126, 0.7152, 0.0722]   # BT.709 Y from gamma-encoded RGB in [0,1]
    gray_world: true           # per-video channel gains so R,G,B means are equal
    target_mean_y: 0.45        # ONE global gain/offset per video (within-video dynamics preserved)
    target_rms_contrast: 0.20  # mean over frames of the spatial SD of Y
    stats_region: vjepa_crop   # statistics on the V-JEPA2 view (short edge -> 292, centre 256^2) (v2.4 G-D032 N-D6)
    max_gain: 3.0              # contrast gain a capped to [min_gain, max_gain]; b re-solved; flag gain_capped
    min_gain: 0.25
    max_clip_frac: 0.01        # fraction of clipped RGB samples (in the crop) above this -> flag; clip is KEPT
    crf: 18
    temporal_smoothing: {enabled: false, size_frames: 5}   # ffmpeg deflicker (per-frame luminance smoothing)

vad:                           # energy VAD shared by speech-gated loudness (P2) and confounds (P3); not speech-specific
  sample_rate: 16000
  frame_s: 0.03
  hop_s: 0.01
  abs_floor_dbfs: -50.0        # frames quieter than this are never speech
  rel_db: 30.0                 # frames more than this below the 95th-percentile frame level are not speech
  ref_percentile: 95
  min_gap_s: 0.3               # merge speech segments separated by less than this
  min_seg_s: 0.1               # drop speech segments shorter than this

transcribe:                    # P2b (v2.md §5 P2b; tribe_requirements §2.2)
  whisperx:
    executable: whisperx
    version: null              # pin at first GPU run (wrapper records the installed version)
    model: large-v3
    language: en
    device: cuda
    compute_type: float16
    batch_size: 16
    align_model: WAV2VEC2_ASR_LARGE_LV60K_960H
  tsv_columns: [text, start, duration, sequence_id, sentence]
  max_unmatched_ratio: 0.05    # TRIBE AddSentenceToWords tolerance; validator enforces the same
  end_tolerance_s: 0.5         # last word may end this far past the media duration
  manifest_columns: [video_id, tsv_sha256]

confounds:                     # P3 per-TR M0 features (v2.md §5 P3)
  rms_floor_db: -120.0
  pitch: {frame_s: 0.04, hop_s: 0.01, fmin_hz: 60.0, fmax_hz: 400.0, voicing_threshold: 0.5, octave_ratio: 0.9}
  video_fps: 10                # luminance / contrast / motion sampling rate
  face_fps: 2                  # face detector sampling rate
  analysis_short_side_px: 292  # frames are analysed at the V-JEPA2 resize (short edge 292)
  face: {detector: haarcascade_frontalface_default.xml, scale_factor: 1.1, min_neighbors: 5, min_size_frac: 0.08,
         crop_min_inside_frac: 0.5}   # face_present_crop: >= this share of the box inside the 256x256 crop
  ffc_regressor: face_area_crop_frac   # P4b(a) FFC regressor, computed inside the V-JEPA2 crop (v2.4 G-D032 N-D5)
  scene: {detector: content, threshold: 27.0, min_scene_len_frames: 15}
  text_detection: false        # on-screen text: not implemented (needs a downloaded EAST/OCR model)

atlases:                       # P5 (v2.md §5 P5; tribe_requirements §8). Consumed by src/yct/features/atlas.py.
  cache_dir: ~/.cache/yct/atlases   # override with env YCT_ATLAS_DIR; files are sha256-checked on every load
  n_vertices_per_hemi: 10242   # fsaverage5 = first 10,242 vertices of each fsaverage hemisphere; order LH then RH
  schaefer400_7:               # primary parcellation; label 0 = Background+FreeSurfer_Defined_Medial_Wall
    source: "CBIG GitHub (ThomasYeoLab/CBIG master), Schaefer2018_LocalGlobal FreeSurfer5.3 fsaverage5 .annot"
    mesh: fsaverage5
    lh:
      url: https://raw.githubusercontent.com/ThomasYeoLab/CBIG/master/stable_projects/brain_parcellation/Schaefer2018_LocalGlobal/Parcellations/FreeSurfer5.3/fsaverage5/label/lh.Schaefer2018_400Parcels_7Networks_order.annot
      file: lh.Schaefer2018_400Parcels_7Networks_order.annot
      sha256: 48dcdc0c63df9feddb34eb631ef3571dfbd73360709a3aa799e05e1bc7d9e2b5
    rh:
      url: https://raw.githubusercontent.com/ThomasYeoLab/CBIG/master/stable_projects/brain_parcellation/Schaefer2018_LocalGlobal/Parcellations/FreeSurfer5.3/fsaverage5/label/rh.Schaefer2018_400Parcels_7Networks_order.annot
      file: rh.Schaefer2018_400Parcels_7Networks_order.annot
      sha256: 1c24e9c5e2e35df05ddb8b82c60ea4ebbbbe48986bc11aa24a58ede47742f5aa
  yeo7:                        # derived from Schaefer names (7Networks_LH_<Net>_<i>); label 0 = medial wall
    networks: [Vis, SomMot, DorsAttn, SalVentAttn, Limbic, Cont, Default]
  hcp_mmp1:                    # labelling + H2 ROIs; fsaverage (163,842/hemi) -> first 10,242 (tribe_requirements §8)
    source: "HCP-MMP1.0 (Glasser 2016) fsaverage annot, figshare files 5528816/5528819 = the files mne.datasets.fetch_hcp_mmp_parcellation (and tribev2.utils.get_hcp_labels) downloads; md5 matches mne's registry. Use requires accepting the HCP terms."
    mesh: fsaverage
    lh:
      url: https://ndownloader.figshare.com/files/5528816
      file: lh.HCPMMP1.annot
      sha256: d4da634644b4c595dbda23963e01752059f0e7714be70169eb84e25e09ba2b44
      md5: 46a102b59b2fb1bb4bd62d51bf02e975
    rh:
      url: https://ndownloader.figshare.com/files/5528819
      file: rh.HCPMMP1.annot
      sha256: 744eff4e57ce8121c43851eea425475baf92d9ba8686299a7435517ab972e9a2
      md5: 75e96b331940227bbcb07c1c791c2463
  destrieux:                   # labelling only; native fsaverage5
    source: "nilearn.datasets.fetch_atlas_surf_destrieux (nilearn 0.14.1), data_dir=<cache_dir>/nilearn"
    mesh: fsaverage5
    lh: {file: nilearn/destrieux_surface/left.aparc.a2009s.annot, sha256: c2401d6137949f33788283a4926cb61cb3b0bfe5bda1b368c22aa921ea06d38d}
    rh: {file: nilearn/destrieux_surface/right.aparc.a2009s.annot, sha256: 99c028f9f9d8dce617e9f29a5ebdc2f1b187d83650b68128fae53c3669588da7}

features:                      # P5 M1 features (v2.md §1)
  m1_networks: [Vis, SomMot, DorsAttn, SalVentAttn, Cont, Default]   # Limbic = omitted reference (rank 6)
  m1_reference: Limbic
  standardize_ddof: 0          # per-TR spatial z-score (step 1); separate from step 4 (v2.4 G-D032 B-D6)
  spatial_sd_ddof: 0           # 7th M1 feature: spatial SD of the raw map
  medial_wall: union           # Schaefer label 0 | HCP-MMP1 ??? | Destrieux Medial_wall (D-034); one mask everywhere

m0:                            # H4 M0 assembly (v2.4 G-D032 Biostat D1, Referee #7/#8; D-034). LABEL-FREE; freeze in prereg
  features:                    # W-averaged per-TR confounds (yct.confounds); visual features inside the V-JEPA2 crop
    - rms_db
    - speech_frac              # forced into K_Q (known issue #8)
    - speech_rate_wps          # forced into K_Q (known issue #8)
    - pitch_mean_hz            # no voiced frame in W -> dataset median + voiced_any = 0
    - luminance_crop
    - contrast_crop
    - motion_energy_crop
    - scene_cuts               # W-mean of per-TR cut counts = cuts / s
    - face_area_crop_frac      # no face -> 0
  never: [text_frac]           # on-screen text not implemented: dropped from M0, never imputed
  binary: [voiced_any]         # added by the pitch imputation rule; never squared, never in K_Q
  forced_kq: [speech_rate_wps, speech_frac]
  k_q: 3                       # K_Q = forced + top (k_q - 2) by 1/VIF; Q has 1 + p + p_nonbin + C(k_q,2) (+ era) columns
  min_words_in_w: 20           # label-free exclusion: no audio track or < 20 words in W (known issue #7)

localize:                      # v2.3 activation localisation outputs (D-032; descriptive); firewall v2.4 G-D032
  top_k: 20
  ci_level: 0.95
  views: [lateral, medial, ventral, dorsal]
  bootstrap_B: 10000           # company-cluster bootstrap, stratified by group; BCa with company jackknife
  unreliable_parcel_max_frac: 0.5   # parcels with a larger share of unreliable vertices are not ranked
  hcp_second_below: 0.5        # report the 2nd-best-overlap HCP area when the best overlap is below this
  unreliable_pattern: ["#000000", "#ffd400"]   # stipple colours for unreliable vertices (outside RdBu_r; never grey)
  caption: >-
    Descriptive only; not inferential. TRIBE v2-predicted (average-subject) relative responses, T1,
    spatially standardised per TR (union medial wall), averaged over W. Atlas names are anatomical
    labels, not functions; no reverse inference. Only the H1 networks and the H2 composite carry
    inferential claims. CIs are company-cluster bootstrap BCa and are not adjusted for parcel
    selection; q (difference map only) is BH-FDR over all parcels (exploratory).
  banned_patterns:             # claim-language lint (yct.interpret.localize.lint_claims); case-insensitive regexes
    - '\bengag(?:e|es|ed|ing|ement)\b'
    - '\bpersua\w*'
    - '\btrust\w*'
    - '\bbrain activity\b'
    - '\bthe brain prefers?\b'
    - '\bactivat(?:e|es|ed|ing)\b'   # verb ("X activates FFA"); the noun "activation" is allowed
    - '\blanguage areas?\b'
    - '\breward\w*'
    - '\bvaluation\b'
    - '\btheory of mind\b'

guards:                        # history exceptions for scripts/check_*.py (FIX-D032-1); exact entries only
  # D-030 adoption commit (owner actions via SSM). Strict ancestors (e.g. 6c16d89, infra/BUDGET_USD under
  # the earlier signed-commit rule) are not checked by check_human_signed; this commit and later are.
  human_signed_since: e4cdc4eedbbbe0c468eed87c10f7548641180147
  test_weakening_allowlist:    # each: full sha + exact test file + finding kind + ticket in BUGS.md
    - {commit: c35c53c533705c080718410cbad001f43ff83247, path: tests/_atlas.py, kind: skip, ticket: BUG-008,
       note: "load_or_skip skip; since FIX-D032-1 it fails unless YCT_OFFLINE=1 (never set in CI)"}
    - {commit: e4cdc4eedbbbe0c468eed87c10f7548641180147, path: tests/conftest.py, kind: skip, ticket: BUG-009,
       note: "ssh-keygen skip in SSH-signing fixture; fixture removed in 8005ceb (D-030)"}
    - {commit: 8005ceb0224dc776f19d996a88ea4311b22affd3, path: tests/test_guards_human_signed.py,
       kind: assertion, ticket: BUG-009, note: "SSH-signature tests removed with D-030 (SSM)"}
    - {commit: 8005ceb0224dc776f19d996a88ea4311b22affd3, path: tests/test_guards_human_signed.py,
       kind: testdef, ticket: BUG-009, note: "SSH-signature tests removed with D-030 (SSM)"}
    - {commit: 8005ceb0224dc776f19d996a88ea4311b22affd3, path: tests/test_guards_prereg.py,
       kind: assertion, ticket: BUG-009, note: "signed-prereg test removed with D-030 (SSM)"}
    - {commit: 8005ceb0224dc776f19d996a88ea4311b22affd3, path: tests/test_guards_prereg.py,
       kind: testdef, ticket: BUG-009, note: "signed-prereg test removed with D-030 (SSM)"}
    - {commit: 8005ceb0224dc776f19d996a88ea4311b22affd3, path: tests/test_guards_test_weakening.py,
       kind: skip, ticket: BUG-009, note: "skip-pattern string in a detector test fixture, not a real skip"}

frozen: []
