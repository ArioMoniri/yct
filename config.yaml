# YCT pipeline configuration (v2.2 defaults already decided in docs/prompts/v2.md).
# Every tunable lives here (v2.md §3). Freezing: add an entry to `frozen:` at the phase gate;
# scripts/check_frozen_config.py then forbids any change to that key (or subtree) and forbids
# removing/re-pointing the entry.
#   frozen:
#     - key: window.start_tr   # dotted path
#       frozen_at: <gate commit sha>
schema_version: 1

tribe:
  tr_s: 1.0                    # TR in seconds (tribe_requirements.md)
  n_vertices: 20484            # fsaverage5, both hemispheres

stimulus:
  t1_trim_s: 58.0              # T1: first 58.0 s fed to TRIBE (v2.md §1)
  t1_max_probe_s: 58.5         # ffprobe duration of the trimmed clip must be <= this
  fps: 30                      # CFR (v2.md P2)
  min_source_fps: 16           # V-JEPA2 samples 16 frames/s
  min_short_side_px: 292       # V-JEPA2 short-edge resize; no letterbox/pillarbox padding
  center_crop_px: 256

window:                        # W, set in P4 from label-free mean time course; frozen there
  default_start_tr: 5          # max(5, 4 + L + 1) once P0 latency L is measured
  default_len_tr: 40
  min_tail_s: 5                # exclude from T1 if trimmed duration < W_end + 5 s (D-039; was 2)
  # D-063 B1 (Gate P4-entry, label-blind, before any analysis-set prediction exists): L and W FIXED and frozen
  # (`frozen:` below). W rule: W may not move after any analysis-set prediction is W-averaged.
  latency_l_tr: 0              # L = 0 TR (D-055: L <= 0, backward leakage 3-4 TR)
  start_tr: 5                  # W = [start_tr, end_tr) TRs = [5, 45) = max(5, 4 + L + 1) + 40
  end_tr: 45

era_strata:                    # from the YC batch calendar, not the data (v2.md §1)
  E1: {last_batch: W2016}
  E2: {first_batch: S2016, last_batch: W2020}
  E3: {first_batch: S2020}
era_merge_min_videos: 6        # strata with < 6 videos merge toward E2
era_blocks:                    # D-047 (Referee P1 D6, Biostat P1 #4): analysis era blocks = merged raw strata.
  # Fixed label-free before any outcome is seen: in_primary E1 = 3, E2 = 7 rows (E1 dummy near-aliased), so
  # E1 + E2 -> E12 ("pre-S2020") for Q(M0) era dummies and exchangeability blocks. The manifest keeps the raw
  # era_stratum and adds era_block (src/yct/curate/manifest.py).
  merge: {E12: [E1, E2], E3: [E3]}
  unknown: UNKNOWN             # era_stratum UNKNOWN -> era_block UNKNOWN
  route_merge_min_videos: 6    # owner-side block coding (scripts/owner_label_qc.sh): era blocks < 6 videos merge within route

manifest:                      # data/manifest.csv derived columns (D-046/D-047/D-048; src/yct/curate/manifest.py)
  decision_date:               # nominal YC decision (notification) date per batch season; label-free calendar rule
    W: {month: 11, day: 15, year_offset: -1}   # Winter batch: mid-November of the previous year
    X: {month: 3, day: 1, year_offset: 0}      # Spring batch (2025+): early March
    S: {month: 5, day: 15, year_offset: 0}     # Summer batch: mid-May
    F: {month: 8, day: 15, year_offset: 0}     # Fall batch (2024+): mid-August
  company_key:                 # D-053 (Referee P1 D1/B4): company_key = sha256(salt + company_id)[:length]. The salt
    salt: "yct-company-key-v1" # is a NON-secret project constant (pseudonymisation against casual joins; company_id
    length: 12                 # stays in the manifest for curation only; analysis code uses company_key)

budget:
  usd_file: infra/BUDGET_USD   # legacy file; owner value now in SSM /yct/owner/budget_usd (D-030)
  ssm_parameter: /yct/owner/budget_usd
  default_usd: 50
  alert_fraction: 0.8
  max_hours_per_instance: 4

seeds:
  company_pick_salt: "yct-v2.1"  # random.Random(sha256(company_id + salt)).choice(sorted(video_ids))
  controls_perm: 20261119       # D-071 (i)(c): P4b between-video permutations (frozen)
  controls_boot: 20261120       # D-071 (i)(d): P4b localiser clip bootstrap (frozen)
  refclips: 20261121            # D-071 (b): per-item seed = int(sha256(f"{refclips}:{family}:{i}:{k}")[:8], 16)

normalize:                     # P2 (v2.md §5 P2; tribe_requirements §2.3-2.4). Consumed by src/yct/normalize.
  hash_len: 16                 # output names are <sha256(output mp4)[:hash_len]>.mp4 (cache hazard, §2.4)
  edge_tolerance_s: 0.05       # a black/silent interval this close to a file edge counts as leading/trailing
  trim_mode: both              # both = trim only where video is black AND audio silent; either = union
  blackdetect: {min_duration_s: 0.1, pix_th: 0.10, pic_th: 0.98}
  silencedetect: {noise_db: -50, min_duration_s: 0.5}
  video: {codec: libx264, crf: 18, preset: medium, pix_fmt: yuv420p, threads: 1}
  audio: {codec: aac, sample_rate: 48000, bitrate: 192k}
  sidecar_wav: {sample_rate: 16000, channels: 1, subdir: audio16k}   # NOT next to the mp4 (TRIBE reuses <stem>.wav)
  loudness:
    target_lufs: -23.0         # speech-gated integrated loudness target
    true_peak_dbtp: -1.0
    target_lra: 20.0           # loudnorm LRA target; high so linear (pure-gain) mode is used where TP allows
    tolerance_lu: 1.0          # |speech-gated LUFS(out) - target| above this -> flag
    tp_tolerance_db: 0.5       # AAC re-encode overshoot allowance before flagging
    min_speech_s: 1.0          # below this much gated speech, fall back to ungated integrated loudness
  mono_phase: {max_drop_db: 3.0, drop_cap_db: 120.0}   # mono-mix RMS drop vs channel RMS; >max -> flag
  av_sync: {max_offset_ms: 40}
  quality_floor: {short_side_px: 480, crf: 28, subdir: q480}   # 480p round-trip copy
  aspect: {portrait_max_ratio: 0.8}  # width/height <= this -> 9:16 stratum
  ffmpeg_loglevel: error
  color:                       # P2/T1 colour matrix (G-D032 c3 Neuro G1/N4, P1 c2 Neuro Q3; D-053). Every P2 output
    # (T1 mp4 and q480 copy) is converted source matrix -> BT.709 / limited range by swscale
    # (scale=in_color_matrix=<src>:in_range=<src>:out_color_matrix=bt709:out_range=tv) and tagged
    # -colorspace/-color_primaries/-color_trc bt709 -color_range tv, so TRIBE/V-JEPA2, the confounds and T3
    # decode one matrix. Only the matrix and range are converted (no gamut/primaries or transfer mapping:
    # BT.601 vs BT.709 primaries differ by < 1 JND on typical content); the source tags are logged per video.
    matrix: bt709
    primaries: bt709
    transfer: bt709
    range: tv
    sws_flags: [accurate_rnd, full_chroma_int]   # ENH-005 (Neuro G-D032 A1): added to the kernel on EVERY
    # P2 swscale colour conversion (T1 lanczos, q480 bicubic); removes the ~-1.5 code-value BT.601->709 bias
    untagged:                  # source matrix when the stream carries no (or an unsupported) colour tag:
      hd_min_long_px: 1280     # long side >= 1280 OR short side > 576 -> HD -> bt709; else SD -> smpte170m
      sd_max_short_px: 576     # (the usual decoder convention; flagged `source_color_untagged`)
      hd: bt709
      sd: smpte170m
      range: tv                # untagged range -> limited
    hdr:                       # ENH-006 (Neuro G-D032 A2). HDR = ffprobe color_transfer in `transfers` (PQ / HLG).
      # Flag `hdr_source` in the record (rec["hdr_source"], rec["color"], flags) and as a binary covariate
      # (yct.normalize.core.normalisation_covariates; enters M0 per D-056 only if >= 1 analysis video is HDR,
      # label-free; all-SDR -> constant, omitted). action tonemap: zscale
      # linearise (npl) -> BT.709 primaries -> tonemap -> BT.709 transfer/matrix, tv range, BEFORE the swscale
      # step; the local ffmpeg must have zscale + tonemap, else normalisation fails loudly. action fail: refuse.
      # Downloads prefer SDR formats (scripts/owner_download_youtube.sh), so this is a fallback.
      transfers: [smpte2084, arib-std-b67]
      action: tonemap
      tonemap: hable
      desat: 0
      npl: 100                 # nominal peak luminance (cd/m^2) for zscale linearisation
      untagged_matrix: bt2020nc     # HDR stream without a matrix / primaries tag
      untagged_primaries: bt2020
      covariate: hdr_source
  photometric:                 # T3 sensitivity copy (owner request); the primary T1 pipeline is unchanged
    enabled: true
    subdir: t3
    analysis_fps: 5            # frames sampled to estimate per-video statistics
    luma_weights: [0.2126, 0.7152, 0.0722]   # BT.709 Y from gamma-encoded RGB in [0,1]
    gray_world: true           # per-video channel gains so R,G,B means are equal
    target_mean_y: 0.45        # ONE global gain/offset per video (within-video dynamics preserved)
    target_rms_contrast: 0.20  # mean over frames of the spatial SD of Y
    stats_region: vjepa_crop   # statistics on the V-JEPA2 view (short edge -> 292, centre 256^2) (v2.4 G-D032 N-D6)
    max_gain: 3.0              # contrast gain a capped to [min_gain, max_gain]; b re-solved; flag gain_capped
    min_gain: 0.25
    max_clip_frac: 0.01        # fraction of clipped RGB samples (in the crop) above this -> flag; clip is KEPT
    crf: 18
    temporal_smoothing: {enabled: false, size_frames: 5}   # ffmpeg deflicker (per-frame luminance smoothing)
    color_matrix: bt709        # decode AND encode with BT.709 matrix; outputs tagged bt709 (QA G-D032 c2 D6)
    color_range: tv            # limited range (16-235); outputs tagged tv
    sws_flags: [accurate_rnd, full_chroma_int]   # ENH-005: T3 decode (stats, lut input) and encode

vad:                           # energy VAD shared by speech-gated loudness (P2) and confounds (P3); not speech-specific
  sample_rate: 16000
  frame_s: 0.03
  hop_s: 0.01
  abs_floor_dbfs: -50.0        # frames quieter than this are never speech
  rel_db: 30.0                 # frames more than this below the 95th-percentile frame level are not speech
  ref_percentile: 95
  min_gap_s: 0.3               # merge speech segments separated by less than this
  min_seg_s: 0.1               # drop speech segments shorter than this

transcribe:                    # P2b (v2.md §5 P2b; tribe_requirements §2.2)
  whisperx:
    executable: whisperx
    version: "3.8.6"           # pinned at the first GPU run (D-061); a different install raises UnpinnedASRError
    model: large-v3
    language: en
    device: cuda
    compute_type: float16
    batch_size: 16
    align_model: WAV2VEC2_ASR_LARGE_LV60K_960H
  wer:                         # D-063 Q5: WER does not block P4; it blocks P5. Fixed before any WER is seen.
    n_hand_checked: 5          # yct_0016, yct_0034, yct_0036, yct_0040, yct_0043 (first 5 sorted ids, D-062)
    action_threshold: 0.25     # WER > 0.25 -> re-transcribe with a new D- entry before P5
    rule: any_video            # strictest reading of "WER > 0.25 on the 5 hand-checked videos": any one of them
  tsv_columns: [text, start, duration, sequence_id, sentence]
  max_unmatched_ratio: 0.05    # TRIBE AddSentenceToWords tolerance; validator enforces the same
  end_tolerance_s: 0.5         # last word may end this far past the media duration
  manifest_columns: [video_id, tsv_sha256]

confounds:                     # P3 per-TR M0 features (v2.md §5 P3)
  rms_floor_db: -120.0
  pitch: {frame_s: 0.04, hop_s: 0.01, fmin_hz: 60.0, fmax_hz: 400.0, voicing_threshold: 0.5, octave_ratio: 0.9}
  video_fps: 10                # luminance / contrast / motion sampling rate
  face_fps: 2                  # face detector sampling rate
  analysis_short_side_px: 292  # frames are analysed at the V-JEPA2 resize (short edge 292)
  face: {detector: haarcascade_frontalface_default.xml, scale_factor: 1.1, min_neighbors: 5, min_size_frac: 0.08,
         crop_min_inside_frac: 0.5}   # face_present_crop: >= this share of the box inside the 256x256 crop
  ffc_regressor: face_area_crop_frac   # P4b(a) FFC regressor, computed inside the V-JEPA2 crop (v2.4 G-D032 N-D5)
  scene: {detector: content, threshold: 27.0, min_scene_len_frames: 15}
  text_detection: false        # on-screen text: not implemented (needs a downloaded EAST/OCR model)

atlases:                       # P5 (v2.md §5 P5; tribe_requirements §8). Consumed by src/yct/features/atlas.py.
  cache_dir: ~/.cache/yct/atlases   # override with env YCT_ATLAS_DIR; files are sha256-checked on every load
  n_vertices_per_hemi: 10242   # fsaverage5 = first 10,242 vertices of each fsaverage hemisphere; order LH then RH
  schaefer400_7:               # primary parcellation; label 0 = Background+FreeSurfer_Defined_Medial_Wall
    source: "CBIG GitHub ThomasYeoLab/CBIG pinned commit 634f676630929a71297852d01dd92a287103e861 (= master on 2026-11-17; sha256 of both files verified identical to the former master URLs), Schaefer2018_LocalGlobal FreeSurfer5.3 fsaverage5 .annot"
    mesh: fsaverage5
    lh:
      url: https://raw.githubusercontent.com/ThomasYeoLab/CBIG/634f676630929a71297852d01dd92a287103e861/stable_projects/brain_parcellation/Schaefer2018_LocalGlobal/Parcellations/FreeSurfer5.3/fsaverage5/label/lh.Schaefer2018_400Parcels_7Networks_order.annot
      file: lh.Schaefer2018_400Parcels_7Networks_order.annot
      sha256: 48dcdc0c63df9feddb34eb631ef3571dfbd73360709a3aa799e05e1bc7d9e2b5
    rh:
      url: https://raw.githubusercontent.com/ThomasYeoLab/CBIG/634f676630929a71297852d01dd92a287103e861/stable_projects/brain_parcellation/Schaefer2018_LocalGlobal/Parcellations/FreeSurfer5.3/fsaverage5/label/rh.Schaefer2018_400Parcels_7Networks_order.annot
      file: rh.Schaefer2018_400Parcels_7Networks_order.annot
      sha256: 1c24e9c5e2e35df05ddb8b82c60ea4ebbbbe48986bc11aa24a58ede47742f5aa
  yeo7:                        # derived from Schaefer names (7Networks_LH_<Net>_<i>); label 0 = medial wall
    networks: [Vis, SomMot, DorsAttn, SalVentAttn, Limbic, Cont, Default]
  hcp_mmp1:                    # labelling + H2 ROIs; fsaverage (163,842/hemi) -> first 10,242 (tribe_requirements §8)
    source: "HCP-MMP1.0 (Glasser 2016) fsaverage annot, figshare files 5528816/5528819 = the files mne.datasets.fetch_hcp_mmp_parcellation (and tribev2.utils.get_hcp_labels) downloads; md5 matches mne's registry. Use requires accepting the HCP terms."
    mesh: fsaverage
    lh:
      url: https://ndownloader.figshare.com/files/5528816
      file: lh.HCPMMP1.annot
      sha256: d4da634644b4c595dbda23963e01752059f0e7714be70169eb84e25e09ba2b44
      md5: 46a102b59b2fb1bb4bd62d51bf02e975
    rh:
      url: https://ndownloader.figshare.com/files/5528819
      file: rh.HCPMMP1.annot
      sha256: 744eff4e57ce8121c43851eea425475baf92d9ba8686299a7435517ab972e9a2
      md5: 75e96b331940227bbcb07c1c791c2463
  destrieux:                   # labelling only; native fsaverage5
    source: "nilearn.datasets.fetch_atlas_surf_destrieux (nilearn 0.14.1), data_dir=<cache_dir>/nilearn"
    mesh: fsaverage5
    lh: {file: nilearn/destrieux_surface/left.aparc.a2009s.annot, sha256: c2401d6137949f33788283a4926cb61cb3b0bfe5bda1b368c22aa921ea06d38d}
    rh: {file: nilearn/destrieux_surface/right.aparc.a2009s.annot, sha256: 99c028f9f9d8dce617e9f29a5ebdc2f1b187d83650b68128fae53c3669588da7}

features:                      # P5 M1 features (v2.md §1)
  m1_networks: [Vis, SomMot, DorsAttn, SalVentAttn, Cont, Default]   # Limbic = omitted reference (rank 6)
  m1_reference: Limbic
  standardize_ddof: 0          # per-TR spatial z-score (step 1); separate from step 4 (v2.4 G-D032 B-D6)
  spatial_sd_ddof: 0           # 7th M1 feature: spatial SD of the raw map
  medial_wall: union           # Schaefer label 0 | HCP-MMP1 ??? | Destrieux Medial_wall (D-034); one mask everywhere

m0:                            # H4 M0 assembly (v2.4 G-D032 Biostat D1, Referee #7/#8; D-034). LABEL-FREE; freeze in prereg
  features:                    # W-averaged per-TR confounds (yct.confounds); visual features inside the V-JEPA2 crop
    - rms_db
    - speech_frac              # forced into K_Q (known issue #8)
    - speech_rate_wps          # forced into K_Q (known issue #8)
    - pitch_mean_hz            # no voiced frame in W -> dataset median + voiced_any = 0
    - luminance_crop
    - contrast_crop
    - motion_energy_crop
    - scene_cuts               # W-mean of per-TR cut counts = cuts / s
    - face_area_crop_frac      # no face -> 0
  never: [text_frac]           # on-screen text not implemented: dropped from M0, never imputed
  binary: [voiced_any]         # added by the pitch imputation rule; linear only, never squared or in products
  forced_speech: [speech_rate_wps, speech_frac]   # known issue #8: linear + both squares + product ALWAYS in Q
  covariates:                  # D-047 upload-metadata covariates (from data/manifest.csv; label-free); D-053
    forced: [platform_nonYT]   # primary: platform != youtube, binary, linear only, ALWAYS in Q(M0)
    # upload_lag_days may be outcome-caused (post-decision uploads; G-D032 c3 Referee N2), so it is NOT in the
    # primary M0: S-LAG sensitivity = primary + these; S-PREDECISION = rows with known lag <= the max below.
    sensitivity: [upload_lag_days, lag_unknown]
    binary: [platform_nonYT, lag_unknown]     # raw 0/1, linear only, never squared or in products
    linear_only: [upload_lag_days]            # z-scored, linear only, never squared or in products
    lag_impute: median         # UNKNOWN lag -> median over the analysis set's known lags + lag_unknown = 1
    predecision_max_lag_days: 0
  min_words_in_w: 20           # label-free exclusion: no audio track or < 20 words in W (known issue #7)
  # Q(M0) rule (D-037; v2.5 C3; yct.features.m0.q_m0). NO PCA. Q columns, in this order:
  #   [1, z(forced_speech), z(other continuous M0), binary, era dummies]           (all linear M0 terms)
  #   + speech_rate_wps^2, speech_frac^2, speech_rate_wps*speech_frac               (forced quadratics)
  #   + optional quadratic terms in the fixed prereg order (squares of the other continuous features by
  #     descending label-free variance of z^2, then all remaining pairwise products by descending
  #     variance of z_a*z_b; ties by name), each kept only while it raises the numerical rank and
  #     rank <= floor(N/3). Aliased columns are dropped and logged; they do not change the span.
  # If the linear + forced block alone exceeds floor(N/3), merge_list steps apply IN ORDER (one at a time,
  # only as many as needed) BEFORE any optional term; if the list is exhausted -> hard failure (DECISIONS
  # entry before P6). z = (x - mean) / SD over the analysis set after exclusions, ddof = z_ddof.
  q_rule: D-037
  z_ddof: 0
  rank_rcond: 1.0e-8           # numerical rank = #(singular values > rank_rcond * s_max)
  max_cond: 1.0e+8             # cond(Q) of the kept columns above this -> hard failure
  merge_list:                  # pre-registered, LABEL-FREE; composite = mean of the members' z-scores
    - name: photometric_crop
      members: [luminance_crop, contrast_crop]
      why: "both are global photometric statistics of the same V-JEPA2 crop (mean and RMS of luma Y'); the T3
        track tests photometry separately, so one composite loses least construct coverage"
    - name: visual_change
      members: [motion_energy_crop, scene_cuts]
      why: "cuts are the extreme case of frame-to-frame change and drive motion-energy transients; both index
        the rate of visual change in the crop"
    - name: voice_acoustics
      members: [rms_db, pitch_mean_hz]
      why: "non-lexical acoustic descriptors of the voice track; rms_db is largely equalised by the P2 -23 LUFS
        normalisation, so it carries little unique variance. pitch_sd_hz is not in M0, so the 'pitch mean +
        sd -> prosody' merge does not apply. Speech rate / fraction and face area are never merged"

localize:                      # v2.3 activation localisation outputs (D-032; descriptive); firewall v2.4 G-D032
  top_k: 20
  ci_level: 0.95
  views: [lateral, medial, ventral, dorsal]
  bootstrap_B: 10000           # company-cluster bootstrap, stratified by group; BCa with company jackknife
  unreliable_parcel_max_frac: 0.5   # parcels with a larger share of unreliable vertices are not ranked
  reliability_mask:            # the "unreliable vertex" set (G-D032 c3 Neuro G2; D-053). FIXED, label-free, before
    # any localisation output; the default of yct.interpret.localize.peak_table / render_four_views /
    # plot_four_views (reliability_mask()). No per-vertex TRIBE reliability map exists (tribe_requirements §4):
    # option (a) (TRIBE on HCP 7T / NNDb with real fMRI) is not available pre-lock and option (b) (paper
    # figure parcel scores) are figures, not data. TRIBE was trained on gradient-echo BOLD, whose targets
    # suffer susceptibility signal dropout in ventral orbitofrontal and anterior/ventral temporal-pole cortex,
    # so predictions there are not interpretable. The mask = these bilateral HCP-MMP1 areas on the union-
    # medial-wall-masked atlas (TGd is already excluded from the H2 composite as dropout-prone, v2.md §1).
    source: susceptibility_dropout_hcp_mmp1
    rule: "union of the listed bilateral HCP-MMP1 areas (L_/R_<area>_ROI), minus the union medial wall"
    atlas: hcp_mmp1             # atlas file pinned by sha256 in atlases.hcp_mmp1
    areas: [OFC, pOFC, 11l, 13l, TGd, TGv]   # orbitofrontal (OFC, pOFC, 11l, 13l) + temporal pole (TGd, TGv)
    hemis: [L, R]
    n_vertices: 732             # 354 LH + 378 RH (fs5); tested
    sha256: d54dcc19537354b9e0aa0731b5ffc88b867ec186483065b50b9fcf28911a6012   # of the sorted vertex ids, <i4
  hcp_second_below: 0.5        # report the 2nd-best-overlap HCP area when the best overlap is below this
  # stipple colours for unreliable vertices: outside RdBu_r, never grey, both chromatic so neither reads as a
  # (dark) sulcal medial-wall grey; Okabe-Ito-like yellow / bluish green (v2.5 C3, G-D032 c2 Neuro N1)
  unreliable_pattern: ["#009e73", "#ffd400"]
  stipple_cell_mm: 4.0         # checker cell on the inflated mesh (> one fsaverage5 face: survives rasterising)
  dpi: 150                     # default savefig dpi; the raster test asserts the stipple is legible at it
  mw_shrink_flag_frac: 0.4     # peak tables flag parcels losing more than this share to the union medial wall
  mw_shrunk_parcels:           # Schaefer parcels losing > 40% of vertices to the union mask (raw -> post); tested
    - 7Networks_RH_Default_PFCdPFCm_6   # 37 -> 14
    - 7Networks_RH_Cont_Cing_1          # 52 -> 23
    - 7Networks_LH_Default_pCunPCC_4    # 38 -> 17
    - 7Networks_RH_Cont_Cing_2          # 35 -> 16
    - 7Networks_RH_Default_pCunPCC_2    # 22 -> 11
    - 7Networks_LH_Cont_Cing_1          # 43 -> 22
    - 7Networks_LH_Cont_Cing_2          # 44 -> 23
  caption: >-
    Descriptive only; not inferential. TRIBE v2-predicted (average-subject) relative responses, T1,
    spatially standardised per TR (union medial wall), averaged over W. Atlas names are anatomical
    labels, not functions; no reverse inference. Only the H1 networks and the H2 composite carry
    inferential claims. CIs are company-cluster bootstrap BCa and are not adjusted for parcel
    selection; q (difference map only) is BH-FDR over all parcels (exploratory).
  banned_patterns:             # claim-language lint (yct.interpret.localize.lint_claims); case-insensitive regexes
    - '\bengag(?:e|es|ed|ing|ement)\b'
    - '\bpersua\w*'
    - '\btrust\w*'
    - '\bbrain activity\b'
    - '\bthe brain prefers?\b'
    - '\bactivat(?:e|es|ed|ing)\b'   # verb ("X activates FFA"); the noun "activation" is allowed
    - '\blanguage areas?\b'
    - '\breward\w*'
    - '\bvaluation\b'
    - '\btheory of mind\b'

controls:                      # P4b positive controls (v2.md §5 P4b; v2.5 C3, D-039; ENH-002). LABEL-FREE.
  # ROIs = unions of HCP-MMP1 areas (names without the L_/R_ prefix and _ROI suffix), bilateral, on the union-
  # medial-wall-masked atlas (yct.features.atlas.load_all). Vertex counts (fs5, both hemis) are tested.
  rois:
    FFC: {areas: [FFC], hemis: [L, R], n_vertices: 104}           # face control (fusiform face complex)
    PH: {areas: [PH], hemis: [L, R], n_vertices: 113}             # localiser (d): place > face
    AUD: {areas: [A4, A5], hemis: [L, R], n_vertices: 223}
    # AUD = A4 ∪ A5 only: speech-preferring auditory association cortex. Not A1/belt (respond to any sound,
    # incl. the P0 flash-driven OOD response), not STS (overlaps the H2 composite -> circular).
    V1_V3: {areas: [V1, V2, V3], hemis: [L, R], n_vertices: 1148}
    MT_plus: {areas: [MT, MST, FST], hemis: [L, R], n_vertices: 139}
    # D-063 Q4 (v2.7 P4E): the GATING low-level visual (motion) control ROI = HCP-MMP MT ∪ MST ∪ FST (MT 38,
    # MST 45, FST 56 fs5 vertices). V4t (the paper's EBA proxy; would let body content pass a motion control)
    # DROPPED (was [MT, MST, FST, V4t], 168). V1-V3 is descriptive only (TRIBE known issue #9); no
    # luminance-only kernel. Frozen (`frozen:` below).
  regressors:                  # computed inside the central 256x256 V-JEPA2 crop where visual; 2 Hz -> 1 Hz mean
    # gating: true = a P4b (a) control that can STOP; false = partialled out / reported only (D-063 Q4)
    face: {source: confounds, column: face_area_crop_frac, roi: FFC, gating: true}
    motion: {source: confounds, column: motion_energy_crop, roi: MT_plus, gating: true}   # D-063 Q4 (was V1_V3)
    luminance_change: {source: derived, from: luminance_crop, op: abs_first_difference, roi: V1_V3, gating: false}
    # D-039 (Referee P0 4a/b): luminance-change energy is partialled out of every within-video control,
    # because AUD responded to the black->white flash more than to speech in P0.
    speech_envelope: {source: derived, from: audio16k, op: hilbert_broadband_envelope_mean, roi: AUD, gating: true}
    # speech envelope is not a yct.confounds column yet: implemented with the P4b controls code (ticket ENH-002)
  descriptive:                 # D-063 Q4: reported beside the gating controls, never gate (V1-V3 non-retinotopic)
    - {regressor: motion, roi: V1_V3}
    - {regressor: luminance_change, roi: V1_V3}
  partial_out: [face, motion, luminance_change, speech_envelope]   # partial r controls for all other regressors
  kernel:                      # NO canonical HRF and NO separate shift by L (the kernel already holds the timing)
    type: measured_impulse_per_roi
    window_tr: [-4, 8]         # control-subtracted course over output lags -4..+8 TR, peak-normalised
    min_reference_clips: 16    # D-071: smallest gating family (MOT 16; LOC 20, SPK 20), derived on CPU in the ROIs above
    shift_by_L: false
    acceptance:                # D-071 (f)/(g), frozen. Lags = kernel.window_tr; halves: selection = even i, test = odd i
      peak: "m_full(p_star), unnormalised standardised; <= 0 -> FAIL"
      K1: {alpha: 0.01, sign_all_positive: true, ffc_min_positive_frac: 0.8}
      K1p: {min_frac_sigma_nat: 0.25, min_abs: 0.2}
      K2: {window: [-1, 4], plateau_frac: 0.9, crossing_window: [-4, 2], crossing_frac: 0.5, tail_lags: [0, 3], tail_frac: 0.5}
      K3: {baseline_lags: [-4, -2], min: 3}
      K3p: {span: [12, -5], max_frac_peak: 0.10, alpha_two_sided: 0.01}
      K4a: {min_median_r: 0.5}
      K4b: {min_r: 0.7}
      K5: {lags: [0, 3], min_abs_frac_peak: 0.2, max_lag_diff: 1}
      K6: {lags: [0, 3], roi: MT_plus}
      on_fail: {FFC: stop, AUD: stop, AUD_audioonly: stop, MT_plus: descriptive}   # MT_plus: owner 2026-11-19
      on_stop_invalid: stop      # STOP_INVALID (or an incomplete motion run) is never a demotion
      demotion_final: true       # a demoted MT_plus stays descriptive through any p4b_ref/v2
  aud_selectivity_run: audio_only   # (b) speech AUD > FFC is evaluated on the audio-only ablation run
  readout_lag_tr: [0, 3]       # (d) localiser readout = mean of output lags 0..3 TR after onset (inclusive)
  maps: [spatially_standardised, raw]   # dry run evaluates both; the hypotheses use the standardised maps
  dry_run:                     # ENH-002 (P0, D-055) reference run; P4b reference counts are controls.refclips.families (D-071)
    reference_clips_min: 16    # D-071: was 5
    talking_face_clip: true    # skipped in P0; required here (face + acoustic latency)
    n_flashes: 5
    n_speech_bursts: 5         # 4-6 s speech on a noise bed: audio-only, text-only, both
  pass:                        # D-071 (i): replaces the v2.5 pass block wholesale (frozen). (d) readout = readout_lag_tr;
    # (c) era merge = era_merge_min_videos; (a) low-SD percentile over the NAT clips; < min_videos -> NAT (n = 15)
    a: {mean_z_min: 0.2, alpha: 0.001, z_clip: 0.999999, low_sd_pctile: 10, min_videos: 15}
    b: {alpha: 0.01}
    c: {r_min: 0.3, alpha: 0.05, n_perm: 10000, route_blocks: false}
    d: {n_boot: 10000, ci: 0.95}
  rois_per_hemi:               # D-071 (i): fs5 vertex counts L, R on the union-medial-wall atlas (L + R = n_vertices)
    FFC: [46, 58]
    PH: [62, 51]
    AUD: [108, 115]
    MT_plus: [74, 65]
    V1_V3: [572, 576]
  mw_removed_frac: {FFC: 0.0, PH: 0.0, AUD: 0.0, MT_plus: 0.0, V1_V3: 0.0}   # union medial wall removes no ROI vertex
  refclips:                    # D-071 (a)-(e), (k): P4b reference-clip campaign p4b_ref/v1 (frozen)
    version: v1
    s3_root: s3://yct-research-235229001983/wave1/derived/p4b_ref/v1/
    campaign_cap_usd: 75       # owner 2026-11-19; scope = ledger launches named ledger_name_prefix*
    campaign_warn_usd: 60      # >= this: the wrapper requires --ack-cap-80
    ledger_name_prefix: yct-p4b-ref
    onsets_s: [9, 29, 49]
    shift_rule: "s = 0 if (i // 2) % 2 == 0 else -1"
    families: {LOC: 20, LOC_SCR: 20, MOT: 16, MOT_STAT: 16, SPK: 20, BURST: 5, FLASH: 5, TALKFACE: 1, GREY_CTRL: 2, NAT: 15}
    mot_directions_deg: [0, 45, 90, 135, 180, 225, 270, 315]
    mot_direction_rule: "((3 * (i // 2) + k) % 8)"
    mot_pattern_rule: "dot if (i // 4) % 2 == 0 else grating"
    loc_categories: [face, body, place]          # objects not curated in v1
    loc_latin_rule: "(i // 2) % 3"
    loc_per_category: 20
    nat_n: 15
    image_licences: [CC0, PD-*, CC-BY-2.0, CC-BY-2.5, CC-BY-3.0, CC-BY-4.0]   # Commons licence template; PD-* = prefix
    image_queries:
      face: ['"frontal portrait photograph"']
      body: ['"person seen from behind full body photograph"']
      place: ['"empty room interior photograph"', '"empty street photograph"']
    nat_query: "lecture OR interview OR talk"
    snapshot_limits: {image: 2000, nat: 1000}
    reject_reasons: [licence, personality_rights, not_photo, multi_subject, face_not_frontal, face_detected,
                     no_face_detected, text_or_logo, person_present, too_small, duplicate, not_english,
                     too_short, not_single_speaker, low_face_present, yc_link]
    greyscale: bt709_luma      # Y' = 0.2126 R' + 0.7152 G' + 0.0722 B' on gamma-encoded values (BT.709 luma, the P2 matrix)
    shine: {steps: [specMatch, lumMatch], iterations: 2, mean_luma: 128, rms_contrast: 32}   # all 60 images jointly
    job_order: [[d038], [GREY_CTRL, SPK, LOC, LOC_SCR, MOT, MOT_STAT, FLASH, NAT], [audioonly, textonly], [BURST, TALKFACE]]
  refclips_artifacts:          # D-071 (d): filled later, each frozen by its own row in the commit that sets it
    image_snapshot_sha256: e8a1d24379f005675487cb3e03fdf2e19ab788af8bfbf25bcc9c63d23663e4ee   # D-074: concat sha of image_{face,body,place}_d074_snapshot.json
    nat_snapshot_sha256: null
    image_manifest_sha256: null
    nat_manifest_sha256: null
    manifest_sha256: null      # refclips_manifest.json, set by T-STIM before upload
  refclips_d074:               # D-074 (owner-approved 2026-11-19): image candidate source; replaces refclips.image_queries for images
    decision: D-074
    image_sources:
      face:  [{category: "Portrait photographs", depth: 0}]
      body:  [{category: "Rear views of people", depth: 0}]
      place: [{category: "Empty rooms", depth: 0}, {category: "Empty streets", depth: 0}]
    namespace: 6
    api: "generator=categorymembers&gcmtype=file&gcmnamespace=6&prop=info|imageinfo&iiprop=mime|mediatype|sha1|size"
    bitmap_mediatype: BITMAP   # mediatype != BITMAP stays in the snapshot, logged not_photo when reached
    image_snapshot_limit: 6000 # per source; more refuses the snapshot (complete enumeration, nothing truncated)
    require_complete: true
    snapshot_file_suffix: "_d074"   # data/refstim/snapshots/image_<cat>_d074_snapshot.json
  refclips_auto:               # D-075 (owner decisions 2026-11-20): frozen automatic image + NAT filters
    decision: D-075
    supersedes: "D-071 (b) human-judgement phrases; D-071 (c) English/single-speaker method"
    env:                       # image filters run on the yct pod CPU only (infra/refstim_env.lock = full freeze)
      where: yct_pod_cpu
      python: "3.12.3"
      lock: infra/refstim_env.lock
      packages: {torch: 2.8.0+cpu, torchvision: 0.23.0+cpu, opencv-python-headless: 4.11.0.86,
                 open_clip_torch: 3.3.0, pytesseract: 0.3.13, numpy: 2.5.5, pillow: 13.0.0}
      tesseract: {binary: "5.3.4", apt: tesseract-ocr=5.3.4-1build5, lang_apt: "tesseract-ocr-eng=1:4.1.0-2",
                  tessdata: tessdata_fast-4.1.0}
    face_detector: {impl: cv2.FaceDetectorYN, repo: opencv/opencv_zoo, revision: f12e12798e8314f7c074a6656816c048dcc95b7a,
                    file: models/face_detection_yunet/face_detection_yunet_2023mar.onnx, input_long_side: 640,
                    score_threshold: 0.9, nms_threshold: 0.3, top_k: 5000, exclusion_score_threshold: 0.5}
    eye_detector: {cascade: haarcascade_eye.xml, scale_factor: 1.1, min_neighbors: 5, min_count: 2,
                   region: upper_half_of_yunet_box_original_image}
    person_detector: {impl: torchvision.models.detection.fasterrcnn_resnet50_fpn_v2, weights: COCO_V1,
                      url: "https://download.pytorch.org/models/fasterrcnn_resnet50_fpn_v2_coco-dd69338a.pth",
                      person_class: 1, score_threshold: 0.5, input_long_side: 1600}
    ocr: {impl: tesseract, psm: 11, oem: 1, min_conf: 60, max_text_area_frac: 0.01, image_long_side: 1600}
    clip: {model: ViT-B-32, pretrained: laion2b_s34b_b79k, hf_repo: laion/CLIP-ViT-B-32-laion2B-s34B-b79K,
           revision: 1a25a446712ba5ee05982a381eed697ef9b435cf, file: open_clip_pytorch_model.bin,
           photo_prompts: ["a photograph", "a drawing", "a painting", "a sculpture or statue", "a computer rendering",
                           "a screenshot"],
           adult_prompts: ["a photo of a child", "a photo of an adult"], decision: argmax}
    headpose:                  # YuNet landmark order; mm; x right, y down, z away from the camera; frontal = 0
      solver: SQPNP
      landmark_order: [right_eye, left_eye, nose_tip, right_mouth_corner, left_mouth_corner]
      model_points_mm: [[-31.5, 0.0, 0.0], [31.5, 0.0, 0.0], [0.0, 35.0, -30.0], [-25.0, 70.0, -5.0], [25.0, 70.0, -5.0]]
      focal: image_width_640_long_side
      max_abs_yaw_deg: 20
      max_abs_pitch_deg: 20
    face_rules: {min_face_height_frac_crop: 0.40, min_interocular_frac_box: 0.25}
    body_rules: {min_person_area_frac: 0.15}
    common: {mimes: [image/jpeg, image/png, image/tiff, image/webp], min_short_side_px: 316, dhash_bits: 64,
             dhash_max_hamming: 4, metadata_terms: ["Y Combinator", "YCombinator", "Demo Day"],
             metadata_regex: '\bYC ?[WSF]\d{2}\b', metadata_manifest: data/manifest.csv,
             metadata_columns: [company_key, company_id]}
    rule_reasons: {C0: not_photo, C1: [licence, personality_rights], C2: too_small, C3: duplicate, C4: text_or_logo,
                   C5: not_photo, F1: [no_face_detected, multi_subject], F2: multi_subject, F6: no_face_detected,
                   F3: [too_small, multi_subject], F4: face_not_frontal, F5: face_not_frontal, F5b: face_not_frontal,
                   F7: personality_rights, F8: text_or_logo, B1: [not_photo, multi_subject], B2: too_small,
                   B3: face_detected, B4: personality_rights, B5: text_or_logo, P1: person_present,
                   P2: face_detected, P3: text_or_logo, N1: not_english, N2: not_single_speaker}
    image_artifacts: [yunet_sha256, frcnn_sha256, clip_sha256, tessdata_eng_sha256, haar_face_sha256,
                      haar_eye_sha256]
    logs: {image: "data/refstim/image_<cat>_auto_log.jsonl", nat: data/refstim/nat_auto_log.jsonl}
    nat:
      cpu_buffer: 40
      lang_id: {impl: faster_whisper.WhisperModel.detect_language, faster_whisper: "1.2.1", model: large-v3,
                samples_s: [0, 30], audio: trimmed_t1, min_prob_en: 0.9}
      diarization: {pipeline: pyannote/speaker-diarization-3.1, revision: 84fd25912480287da0247647c3d2b4853cb3ee5d,
                    segmentation: pyannote/segmentation-3.0@e66f3d3b9eb0873085418a7b813d3b369bf160bb,
                    embedding: pyannote/wespeaker-voxceleb-resnet34-LM@837717ddb9ff5507820346191109dc79c958d614,
                    pyannote_audio: "4.1.0", audio: trimmed_t1, min_main_speaker_frac: 0.95,
                    max_other_speaker_s: 3.0, zero_speech: not_single_speaker}
      stage: session_0
      counts_toward_cap: true
      weights_mirror: models/   # under controls.refclips.s3_root; loaded with HF_HUB_OFFLINE=1
    determinism: {torch_seed: 0, threads: 1}
  refclips_auto_artifacts:     # D-075: set in commit k, frozen by its own row with frozen_at = k in commit k+1
    yunet_sha256: null
