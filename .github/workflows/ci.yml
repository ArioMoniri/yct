name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # guards diff against the base and need tags (prereg-lock)
      - run: git fetch --force --tags origin '+refs/heads/*:refs/remotes/origin/*'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          pip install -e '.[dev,pre]' ruff==0.8.4
      - name: Resolve guard base
        id: base
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            BASE="origin/$PR_BASE"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BASE="$BEFORE"
          else
            BASE="origin/$DEFAULT"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "guard base: $BASE"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: python -m pytest -q
      - name: Integrity guards
        run: make guards BASE=${{ steps.base.outputs.base }}

  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history scan (v2.md §2b.4 item 7)
      - name: gitleaks (full history)
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2
          detect --source /repo --config /repo/.gitleaks.toml --redact --verbose
