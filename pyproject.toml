[project]
name = "yct"
version = "0.0.1"
description = "TRIBE v2 predicted cortical responses to accepted vs rejected YC application videos"
requires-python = ">=3.11"  # v2.md §3 pins: Python >= 3.11
dependencies = ["pyyaml", "pandas", "numpy", "pydantic>=2"]

[project.optional-dependencies]
# ruff pinned exactly; CI installs the same version via requirements.lock (BUG-007).
dev = ["pytest==9.2.0", "ruff==0.17.5"]
# P2/P3 preprocessing (also needs system ffmpeg/ffprobe >= 6). opencv 4.x: 5.x dropped CascadeClassifier;
# scenedetect 0.6.x: 0.7 hard-depends on non-headless opencv-python. pyarrow: confounds.parquet.
pre = ["opencv-python-headless==4.11.0.86", "scenedetect==0.6.7", "pyarrow==26.0.1"]
# P5 atlases / localisation plots (src/yct/features, src/yct/interpret)
neuro = ["nilearn==0.14.1", "nibabel==5.5.0", "matplotlib==3.11.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "atlas: needs real atlas files (downloaded once to ~/.cache/yct/atlases); missing atlases FAIL unless YCT_OFFLINE=1 (BUG-008)",
]

[tool.ruff]
line-length = 110
# analysis/power/: archived power-analysis scripts cited as evidence in reviews; kept byte-identical.
# analysis/sims_c2/: Biostat cycle-2 simulation scripts (commit b834dff), archived evidence, kept byte-identical.
# analysis/neuro_checks/: Neuro G-D032 condition-verification scripts (commit cfeac3d), archived evidence,
# lint-exempt (committed lint-red, so `ruff check .` failed at cfeac3d); only -nostdin added (test_ffmpeg_nostdin).
extend-exclude = ["analysis/power", "analysis/sims_c2", "analysis/neuro_checks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "N", "UP"]

[tool.ruff.lint.per-file-ignores]
"infra/lambda_gpu.py" = ["E501", "E702"]
"scripts/gpu_p0_rerun.py" = ["E501"]   # long remote shell command strings
"scripts/p0_rerun_report.py" = ["E501"]  # markdown table rows
